<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Producto - TechStore Online</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav aria-label="Navegación principal">
      <a href="index.html" class="brand" aria-label="TechStore Online - Inicio"><strong>TechStore<span class="brand__suffix"> Online</span></strong></a>
      <div class="nav-actions">
        <a href="admin.html">Iniciar sesión</a>
        <a href="carrito.html" class="cart-link" aria-label="Carrito, 0 productos">
          <span class="cart-icon" aria-hidden="true">&#128722;</span>
          <span class="visually-hidden">Carrito</span>
          <span class="cart-count">0</span>
        </a>
      </div>
    </nav>
  </header>

  <main>
    <p id="product-status" role="status" aria-live="polite">
      Cargando producto...
    </p>

    <article id="product-details" aria-labelledby="producto-titulo" hidden>
      <header>
        <p>
          <a href="index.html">Inicio</a> /
          <a href="index.html#products">Productos</a> /
          <span id="producto-breadcrumb"></span>
        </p>
      </header>

      <section aria-label="Imagen y detalles del producto">
        <figure>
          <img id="producto-imagen" src="" alt="" width="600" height="500">
        </figure>

        <div>
          <p id="producto-categoria"></p>
          <h1 id="producto-titulo"></h1>
          <p><strong id="producto-precio"></strong></p>

          <form id="add-to-cart-form" aria-label="Agregar producto al carrito">
            <label for="cantidad">Cantidad</label>
            <input id="producto-id" name="id" type="hidden">
            <input id="producto-precio-valor" name="precio" type="hidden">
            <input id="cantidad" name="cantidad" type="number" min="1" value="1">
            <button type="submit">Agregar al carrito</button>
            <p id="add-to-cart-message" class="form-message" role="status"></p>
          </form>
        </div>
      </section>

      <section aria-labelledby="descripcion-titulo">
        <h2 id="descripcion-titulo">Descripción</h2>
        <p id="producto-descripcion"></p>
      </section>
    </article>
  </main>

  <footer>
    <p>&copy; 2026 TechStore Online</p>
  </footer>
  <script src="supabase-config.js"></script>
  <script src="products.js"></script>
  <script src="cart.js"></script>
</body>
</html>
